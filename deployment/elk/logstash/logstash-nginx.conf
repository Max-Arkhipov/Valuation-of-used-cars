input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json {
      target => "event"
    }
    type => "app-file-logs"
  }
}

filter {
  date {
    match => ["event.timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "backend-logs-%{+YYYY.MM.dd}"
    user => "test_user"
    password => "MyPw123"
  }
  stdout { codec => rubydebug }
}
